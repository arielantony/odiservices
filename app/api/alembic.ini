# Alembic (BE-31). Run it through the Makefile: make db-upgrade, db-sql, ...
# The database URL is never here: migrations/env.py reads
# PORTAL_MIGRATION_DATABASE_URL from the environment.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Run env.py for `alembic revision` too, so it picks the next sequential id.
revision_environment = true

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
